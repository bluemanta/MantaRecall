services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aml
      POSTGRES_PASSWORD: amlpass
      POSTGRES_DB: aml
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aml -d aml"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://aml:amlpass@db:5432/aml
      CONFIG_PATH: /app/config.yaml
    ports:
      - "127.0.0.1:8000:8000"  # 仅本机：公网经 nginx 反代进入
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
